<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pics</title>
<style>body{margin:0;background:#000}h2{text-align:center;color:#ffcc00;font-family:Arial;padding:12px 0;margin:0}#g{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;padding:6px}img{width:100%;height:170px;object-fit:cover;border-radius:6px;background:#111}#c{text-align:center;color:#888;font-family:Arial;font-size:14px}</style>
</head>
<body>
<h2>🌞 SURYA GITA Pics</h2>
<div id="c">Loading...</div>
<div id="g"></div>
<script>
fetch("https://api.github.com/repos/amarsinghparihar/surya-gita/contents")
.then(r=>r.json()).then(d=>{
let f=d.filter(x=>/^amar-/.test(x.name)&&x.name.endsWith(".jpg")).sort((a,b)=>a.name.localeCompare(b.name));
document.getElementById("c").innerText="Total "+f.length+" pics";
let g=document.getElementById("g");
f.forEach(i=>{let im=document.createElement("img");im.src=i.download_url;im.loading="lazy";g.appendChild(im);});
});
</script>
</body>
</html>
