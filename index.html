<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SURYA GITA - 156 Photos</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fffbe6;font-family:sans-serif}
.top{padding:14px;text-align:center;background:#ffcc00;font-weight:700;font-size:18px;position:sticky;top:0}
.grid{padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#eee}
.card p{margin:0;padding:8px;font-size:12px;text-align:center;word-break:break-all;background:#fff8d0}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr 1fr 1fr}}
</style>
</head>
<body>
<div class="top">SURYA GITA - 156 PHOTOS</div>
<div class="grid" id="grid"></div>

<script>
let grid = document.getElementById('grid');

for(let i=0;i<156;i++){
  let pad3 = String(i).padStart(3,'0');
  let pad2 = String(i).padStart(2,'0');

  // sab tarah ke naam try karega, jo milega wahi khulega
  let urls = [
    'amai-id-'+i+'.jpg',
    'amai-id-'+pad3+'.jpg',
    'amai-id-'+pad2+'.jpg'
  ];

  // Pages link pehle, fir Raw link
  let tries = [];
  urls.forEach(function(n){
    tries.push('https://amarsinghparihar.github.io/surya-gita/'+n);
    tries.push('https://raw.githubusercontent.com/amarsinghparihar/surya-gita/main/'+n);
  });

  let card = document.createElement('div');
  card.className = 'card';
  let img = document.createElement('img');
  img.loading = 'lazy';
  img.alt = 'amai-id-'+i;
  let k = 0;
  img.src = tries[k];
  img.onerror = function(){
    k++;
    if(k < tries.length){ this.src = tries[k]; }
    else { this.style.display='none'; }
  };

  let p = document.createElement('p');
  p.textContent = 'amai-id-'+i+'.jpg';

  card.appendChild(img);
  card.appendChild(p);
  grid.appendChild(card);
}
</script>
</body>
</html>
