<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SURYA GITA</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;font-family:sans-serif}
.top{background:#ffcc00;padding:14px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.top b{font-size:24px}
.top span{background:#000;color:#ffcc00;padding:6px 12px;border-radius:20px;font-size:14px}
.run{background:red;color:white;padding:10px;font-weight:900;font-size:17px;white-space:nowrap;overflow:hidden}
.run span{display:inline-block;padding-left:100%;animation:scroll 25s linear infinite}
@keyframes scroll{to{transform:translateX(-100%)}}
.intro{margin:12px;border:2px solid red;border-radius:12px;padding:16px;background:#fffbe6;font-size:17px;line-height:1.8;word-break:break-word}
.intro h2{margin:0 0 8px 0;font-size:22px;text-align:center}
.btnrow{display:flex;gap:10px;margin:10px 0}
.btnrow button{flex:1;padding:12px;border:0;border-radius:8px;font-weight:900;font-size:16px;cursor:pointer}
.b1{background:#ffcc00;color:#000}
.b2{background:#000;color:#ffcc00}
.b1.active,.b2.active{outline:3px solid red}
#readmeText{white-space:pre-wrap;word-break:break-word;max-height:none;overflow:visible}
.sec{margin:18px 12px 6px 12px;font-size:20px;font-weight:900;background:#ffcc00;padding:10px;border-radius:8px;text-align:center}
.feed{padding:0 10px 30px 10px;display:flex;flex-direction:column;gap:18px}
.card{background:#fff;border:1px solid #eee;border-radius:12px;overflow:hidden}
.card img{width:100%;height:auto;display:block;object-fit:contain;background:#f5f5f5;min-height:100px}
.info{padding:10px;display:flex;gap:10px;align-items:flex-start}
.logo{width:40px;height:40px;background:#ffcc00;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.info b{font-size:15px;line-height:1.4;display:block;word-break:break-all}
.info span{font-size:14px;color:#555}
.actions{display:flex;gap:18px;padding:0 10px 12px 60px;color:#333;font-size:15px;font-weight:700}
#status{padding:12px;text-align:center;font-weight:700}
</style>
</head>
<body>
<div class="top"><b>☀️ SURYA GITA</b><span>SUBSCRIBE</span></div>
<div class="run"><span>SURYA GITA | Shraddha - Gyan - Sadhna - Paropkar |</span></div>
<div class="intro"><h2>SURYA GITA</h2>
<div class="btnrow">
<button id="btn1" class="b1 active" onclick="showPart(1)">PART 1 - HINGLISH</button>
<button id="btn2" class="b2" onclick="showPart(2)">PART 2 - HINDI</button>
</div>
<div id="readmeText">README load ho raha hai... poora load hoga, thoda rukiye...</div>
<div id="readmeInfo" style="font-size:13px;color:#666;margin-top:10px;text-align:center"></div>
</div>
<div class="sec">TOTAL 156 POSTER</div>
<div id="status">Posters load ho rahe hain...</div>
<div id="all"></div>
<script>
var USER="amarsinghparihar";
var REPO="surya-gita";
var fullText="";
var part1="";
var part2="";
function clean(t){
  return t.replace(/<h1[^>]*>/gi,"\n").replace(/<\/h1>/gi,"\n").replace(/<h2[^>]*>/gi,"\n").replace(/<\/h2>/gi,"\n").replace(/<p[^>]*>/gi,"\n").replace(/<\/p>/gi,"\n").replace(/<b>/gi,"").replace(/<\/b>/gi,"").replace(/<br[^>]*>/gi,"\n").replace(/<[^>]+>/g,"").replace(/\*\*/g,"").replace(/^### /gm,"").replace(/^## /gm,"").replace(/^# /gm,"");
}
function showPart(n){
  var el=document.getElementById("readmeText");
  var b1=document.getElementById("btn1");
  var b2=document.getElementById("btn2");
  if(n===1){ el.textContent=part1||fullText; b1.classList.add("active"); b2.classList.remove("active"); }
  else { el.textContent=part2||"PART 2 abhi README me alag se nahi mila, neeche poora README dikh raha hai."; if(!part2){ el.textContent=fullText; } b2.classList.add("active"); b1.classList.remove("active"); }
  window.scrollTo(0,0);
}
fetch("https://raw.githubusercontent.com/"+USER+"/"+REPO+"/main/README.md").then(function(r){return r.text()}).then(function(t){
  fullText=clean(t);
  document.getElementById("readmeInfo").textContent="Poora README load ho gaya - Total length: "+fullText.length+" akshar";
  var idx=-1;
  var keys=["PART II","PART 2","PART-2","PART-II","HINDI VERSION","PART II --","PART II -"];
  for(var i=0;i<keys.length;i++){ var p=fullText.toUpperCase().indexOf(keys[i]); if(p>0){ idx=p; break; } }
  if(idx>0){ part1=fullText.slice(0,idx); part2=fullText.slice(idx); }
  else { part1=fullText; part2=""; }
  showPart(1);
}).catch(function(){ document.getElementById("readmeText").textContent="README load nahi hua. GitHub me README.md check kijiye."; });
function makeCard(name, base){
  var card=document.createElement("div"); card.className="card";
  var img=document.createElement("img"); img.loading="lazy"; img.alt=name;
  var exts=[".jpg",".jpeg",".JPG",".JPEG",".png",".webp"];
  var i=0;
  function tryNext(){ if(i>=exts.length){ card.style.display="none"; return; } img.src=base+exts[i]; i++; }
  img.onerror=tryNext; tryNext();
  var info=document.createElement("div"); info.className="info";
  info.innerHTML='<div class="logo">☀️</div><div><b>'+name+'</b><span>SURYA GITA - 156 POSTER</span></div>';
  var act=document.createElement("div"); act.className="actions"; act.textContent="👍 Like    💬 Comment    ↗️ Share";
  card.appendChild(img); card.appendChild(info); card.appendChild(act);
  return card;
}
function buildFromList(files){
  var all=document.getElementById("all");
  var feed=document.createElement("div"); feed.className="feed"; all.appendChild(feed);
  document.getElementById("status").textContent="Total posters mile: "+files.length+" / 156 POSTER";
  files.forEach(function(f){
    var base=f.download_url.replace(/\.(jpg|jpeg|png|webp|gif)$/i,"");
    feed.appendChild(makeCard(f.name, base));
  });
}
function buildFromNames(){
  var all=document.getElementById("all");
  var feed=document.createElement("div"); feed.className="feed"; all.appendChild(feed);
  document.getElementById("status").textContent="156 POSTER - Naam se load ho rahe hain";
  for(var i=0;i<60;i++){ feed.appendChild(makeCard("amai-id-"+i, "amai-id-"+i)); }
  for(var j=0;j<120;j++){ var n=("00"+j).slice(-3); feed.appendChild(makeCard("amar-"+n, "amar-"+n)); }
  for(var k=1;k<=34;k++){ feed.appendChild(makeCard("amar-news-"+k, "amar-news-"+k)); }
  feed.appendChild(makeCard("organiser-news-1","organiser-news-1"));
  feed.appendChild(makeCard("organiser-news-2","organiser-news-2"));
}
fetch("https://api.github.com/repos/"+USER+"/"+REPO+"/contents/?per_page=1000").then(function(r){return r.json()}).then(function(list){
  if(!list || !list.length || list.message){ buildFromNames(); return; }
  var files=list.filter(function(f){return f.type==="file" && /\.(jpg|jpeg|png|webp|gif)$/i.test(f.name)}).sort(function(a,b){return a.name.localeCompare(b.name)});
  if(files.length<10){ buildFromNames(); } else { buildFromList(files); }
}).catch(function(){ buildFromNames(); });
</script>
</body>
</html>
