<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SURYA GITA</title>
<style>
html,body{margin:0;padding:0;background:#fffbe6}
.card{margin:0 0 12px 0}
.card img{width:100%;height:auto;display:block}
.card .nm{padding:8px;background:#ff0;color:#000;font:bold 14px sans-serif;text-align:center;word-break:break-all}
</style>
</head>
<body>
<div id="g"></div>
<script>
(async()=>{
let r=await fetch('https://api.github.com/repos/amarsinghparihar/surya-gita/contents?'+Date.now());
let j=await r.json();
j=j.filter(f=>f.name.toLowerCase().endsWith('.jpg'));
j.sort((a,b)=>a.name.localeCompare(b.name,'en',{numeric:true}));
let g=document.getElementById('g');
j.forEach(f=>{
let d=document.createElement('div');d.className='card';
d.innerHTML=`<img src="./${f.name}"><div class="nm">${f.name}</div>`;
g.appendChild(d);
});
})()
</script>
</body>
</html>
