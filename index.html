<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SURYA GITA</title>
<style>
body{margin:0;background:#fffbe6}
img{width:100%;display:block;clip-path:inset(13% 0 10% 0);margin:-6% 0}
</style>
</head>
<body>
<div id="top"><b id="cnt">Loading...</b></div>
<div id="g"></div>
<script>
async function start(){
let s='/';
let u='https://'+s+'api.github.com/repos/amarsinghparihar/surya-gita/contents';
let r=await fetch(u);
let j=await r.json();
let c=document.getElementById('g');
let n=0;
j.forEach(f=>{
if(f.name.match(/\.jpe?g$/i)){
let i=document.createElement('img');
i.src=f.download_url;
c.appendChild(i);
n++
}
});
document.getElementById('cnt').innerText=n+' photos'
}
start()
</script>
</body>
</html>
