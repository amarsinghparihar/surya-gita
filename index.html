<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surya Gita</title>
<style>
body{margin:0;background:#fff8e1;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:10px}
.grid img{width:100%;border-radius:10px}
</style>
</head>
<body>
<div id="gallery" class="grid"></div>
<script>
const g=document.getElementById('gallery');
for(let i=1;i<=1000;i++){
let img=new Image();
img.src=`amar-pic-${i}.jpg`;
img.onerror=()=>img.remove();
g.appendChild(img);
}
</script>
</body>
</html>
