<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SURYA GITA</title>
<style>
html,body{margin:0;padding:0;background:#fffbe6}
#top{padding:12px;background:#fffbe6;font-family:sans-serif}
.card{margin:0 0 8px 0;background:#fffbe6}
.card img{width:100%;height:auto;display:block}
.card .nm{padding:6px 10px;font-family:sans-serif;font-size:13px;background:#fff8d0;word-break:break-all}
</style>
</head>
<body>
<div id="top"><b id="cnt">Loading...</b></div>
<div id="g"></div>
<script>
async function start(){
let r=await fetch('https://api.github.com/repos/amarsinghparihar/surya-gita/contents?'+Date.now());
let j=await r.json();
j=j.filter(f=>{let n=f.name.toLowerCase();return n.endsWith('.jpg')||n.endsWith('.jpeg')});
j.sort((a,b)=>a.name.localeCompare(b.name,'en',{numeric:true}));
let c=document.getElementById('g');
j.forEach(f=>{
let d=document.createElement('div');d.className='card';
let im=document.createElement('img');im.src='./'+f.name;im.loading='lazy';
let nm=document.createElement('div');nm.className='nm';nm.textContent=f.name;
d.appendChild(im);d.appendChild(nm);c.appendChild(d);
});
document.getElementById('cnt').innerText=j.length+' photos';
}
start()
</script>
</body>
</html>
