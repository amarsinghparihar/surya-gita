<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SURYA GITA</title>
</head>
<body style="margin:0;background:#fffbe6;text-align:center">
<div style="position:sticky;top:0;background:#fffbe6;padding:10px;border-bottom:2px solid orange">
<b>SURYA GITA</b> Total: <span id="t">0</span>
</div>
<div id="g"></div>
<script>
var a='https://api.github.com/repos/';
var b='amarsinghparihar/surya-gita/contents/';
fetch(a+b).then(r=>r.json()).then(d=>{
var g=document.getElementById('g'),c=0;
d.forEach(f=>{
if(f.name.match(/jpg|png/i)){
var im=new Image();im.src=f.name;
im.style="width:95%;margin:10px;border-radius:10px";
im.onload=function(){c++;document.getElementById('t').innerText=c};
g.appendChild(im);
}});
});
</script>
</body>
</html>
