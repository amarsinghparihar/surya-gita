<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SURYA GITA</title>
<style>body{margin:0;background:#fffbe6}img{width:100%;display:block;clip-path:inset(13% 0 10% 0);margin:-6% 0} .name{text-align:center;padding:5px;background:#fff3a0;font-size:11px} #top{text-align:center;padding:8px;background:#fff8d0;position:sticky;top:0}</style>
</head>
<body>
<div id="top"><b id="cnt">Loading...</b></div>
<div id="g"></div>
<script>async function start(){let s='/';let u='https:'+s+s+'api.github.com/repos/amarsinghparihar/surya-gita/contents?per_page=1000';let r=await fetch(u);let f=await http://r.json();let j=f.filter(x=>x.name.endsWith('.jpg'));j.sort((a,b)=>a.name.localeCompare(b.name,{numeric:true}));document.getElementById('cnt').textContent='Total '+j.length;let g=document.getElementById('g');j.forEach(x=>{let d=document.createElement('div');let i=document.createElement('img');i.src=x.name;i.loading='lazy';let n=document.createElement('div');n.className='name';n.textContent=x.name;d.appendChild(i);d.appendChild(n);g.appendChild(d)})}start();</script>
</body>
</html>
