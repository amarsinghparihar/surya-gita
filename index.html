<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SURYA GITA</title></head>
<body style="margin:0;text-align:center;background:#fffbe6">
<div style="position:sticky;top:0;background:#fffbe6;padding:8px">
<b>☀️ SURYA GITA 🚩</b><br>Total: <span id="cnt">0</span><br>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="padding:8px 20px;background:#ff6600;color:#fff;border:none;border-radius:8px">HOME</button>
</div>
<div id="g"></div>
<script>
let g=document.getElementById('g'),cnt=0;
for(let i=1;i<=999;i++){
let im=document.createElement('img');
im.loading='lazy';
im.style='max-width:95%;margin:8px auto;display:block;border-radius:10px';
im.onload=function(){g.appendChild(this);cnt++;document.getElementById('cnt').innerText=cnt};
im.onerror=function(){};
im.src='amar-img-'+i+'.jpg';
}
</script>
</body>
</html>
