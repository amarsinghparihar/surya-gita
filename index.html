<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SURYA GITA</title>
</head>
<body style="margin:0;text-align:center;background:#fffbe6">
<div style="position:sticky;top:0;background:#fffbe6;padding:10px;border-bottom:1px solid #ccc;z-index:9">
<b>☀️ SURYA GITA 🚩</b><br>
Total: <span id="cnt">0</span><br>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="padding:8px 20px;background:#ff6600;color:#fff;border:none;border-radius:8px">HOME</button>
</div>
<div id="g"></div>
<script>
let g=document.getElementById('g'),c=0;
function add(s){
let im=new Image();
im.loading="lazy";
im.style="max-width:95%;margin:8px auto;display:block;border-radius:10px";
im.onload=function(){g.appendChild(this);c++;document.getElementById('cnt').innerText=c};
im.onerror=function(){};
im.src=s;
}
let p=["amar-img-","amar-pic-","amar-news-","amar-id-","amar-photo-","amar-cv-","amar-intro-"];
for(let a of p){for(let i=1;i<=999;i++){add(a+i+".jpg")}}
add("amar-id-2.jpg");add("amar-cv-king.jpg");add("amar-phd-tratak.jpg");add("amar-primary-tratak.jpg");
</script>
</body>
</html>
