<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SURYA GITA</title>
<style>
body{margin:0;padding:10px;background:#fff8e1;font-family:Arial}
h1{text-align:center;color:#e65100}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.grid img{width:100%;height:170px;object-fit:cover;border-radius:8px;border:1px solid #ccc}
</style>
</head>
<body>
<h1>🌞 SURYA GITA 🚩</h1>
<h3 id="count" style="text-align:center"></h3>
<div class="grid" id="g"></div>
<script>
fetch("https://api.github.com/repos/amarsinghparihar/surya-gita/contents/")
.then(r=>r.json())
.then(files=>{
  const jpgs = files.filter(f=>f.name.toLowerCase().endsWith('.jpg')).sort((a,b)=>a.name.localeCompare(b.name));
  document.getElementById('count').innerText = "Total: "+jpgs.length;
  const g=document.getElementById('g');
  jpgs.forEach(f=>{
    const d=document.createElement('div');
    d.innerHTML=`<img src="${f.name}" loading="lazy"><div style="font-size:10px;text-align:center">${f.name}</div>`;
    g.appendChild(d);
  });
});
</script>
</body>
</html>
