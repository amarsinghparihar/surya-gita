<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SURYA GITA</title>
<style>
body{margin:0;padding:12px;background:#fff8e1;font-family:Arial}
h1{text-align:center;color:#e65100}
.grid{display:flex;flex-direction:column;gap:28px;max-width:720px;margin:0 auto}
.grid div{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.grid img{width:100%;height:auto;object-fit:contain;display:block}
#lb{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:999}
#lb img{max-width:96%;max-height:92%;object-fit:contain}
</style>
</head>
<body>
<h1>🌞 SURYA GITA 🚩</h1>
<h3 id="count" style="text-align:center"></h3>
<div class="grid" id="g"></div>
<div id="lb" onclick="this.style.display='none'"><img id="lbimg"></div>
<script>
fetch("https://api.github.com/repos/amarsinghparihar/surya-gita/contents/")
.then(r=>r.json()).then(files=>{
const jpgs=files.filter(f=>f.name.toLowerCase().endsWith('.jpg')).sort((a,b)=>a.name.localeCompare(b.name));
document.getElementById('count').innerText="Total: "+jpgs.length;
const g=document.getElementById('g');
jpgs.forEach(f=>{
const d=document.createElement('div');
d.innerHTML=`<img src="${f.name}" loading="lazy" onclick="lbimg.src=this.src;lb.style.display='flex'"><div style="font-size:12px;text-align:center;padding:8px">${f.name}</div>`;
g.appendChild(d);
});
});
</script>
</body>
</html>
