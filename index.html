<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SURYA GITA</title>
<style>
body{margin:0;background:#000;color:#fff;text-align:center}
.top{background:darkblue;padding:8px;color:#ffcc00;border:2px solid gold;font-size:12px;word-break:break-all}
button{background:gold;color:#000;padding:15px 30px;font-size:22px;font-weight:bold;border-radius:12px;margin:20px}
#gallery{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
#gallery img{width:330px;max-width:95%;border:3px solid gold;border-radius:10px}
</style>
</head>
<body>

<div class="top">amarsinghparihar.github.io/surya-gita/</div>

<button onclick="show()">HOME PAGE - 99 PHOTOS</button>
<div id="gallery"></div>

<script>
function show(){
  let g=document.getElementById('gallery');
  g.innerHTML="";
  for(let i=1;i<=99;i++){
    let img=document.createElement('img');img.src="amar-pic-"+i+".jpg";
    img.onerror=function(){this.remove()};
    g.appendChild(img);
  }
}
</script>

</body>
</html>
