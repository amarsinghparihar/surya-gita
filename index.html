<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SURYA GITA</title>
<style>body{margin:0;background:#fffbe6}img{width:100%;display:block;clip-path:inset(13% 0);margin:-5% 0}</style>
</head>
<body>
<div id="g"></div>
<script>
let g=document.getElementById('g');
for(let i=1;i<=122;i++){
let im=document.createElement('img');
im.src=i+'.jpg';
im.onerror=function(){
 if(this.src.endsWith('.jpg')){this.src=i+'.JPG';}else{this.remove();}
};
g.appendChild(im);
}
</script>
</body>
</html>
