<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SURYA GITA</title>
</head>
<body style="margin:0;text-align:center;background:#fffbe6">
<div style="position:sticky;top:0;background:#fffbe6;padding:10px;border-bottom:1px solid #ccc">
<b>☀️ SURYA GITA 🚩</b><br>
Total: <span id="cnt">0</span><br>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="padding:8px 20px;background:#ff6600;color:#fff;border:none;border-radius:8px">HOME</button>
</div>
<div id="g"></div>
<script>
let g=document.getElementById('g'),c=0;
let files=[
["amar-img-",21],["amar-pic-",31],["amar-news-",34],
["amar-id-",16],["amar-photo-",9],["amar-cv-",5],
["amar-intro-",3]
];
let single=["amar-id-2.jpg","amar-cv-king.jpg","amar-phd-tratak.jpg","amar-primary-tratak.jpg","amar-cv-1.jpg","amar-cv-2.jpg","amar-cv-3.jpg","amar-cv-4.jpg","amar-cv-5.jpg"];

function add(src){
 let im=new Image();
 im.loading="lazy";
 im.style="max-width:95%;margin:8px auto;display:block;border-radius:10px";
 im.onload=()=>{g.appendChild(im);c++;document.getElementById('cnt').innerText=c};
 im.onerror=()=>{};
 im.src=src;
}
for(let [p,n] of files){for(let i=1;i<=n;i++){add(p+i+".jpg")}}
for(let s of single){add(s)}
for(let i=1;i<=999;i++){
 add("amar-img-"+i+".jpg");
 add("amar-pic-"+i+".jpg");
 add("amar-news-"+i+".jpg");
}
</script>
</body>
</html>
