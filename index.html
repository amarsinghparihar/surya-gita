<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SURYA GITA</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#fff;font-family:sans-serif}
.sec{margin:12px;font-size:20px;font-weight:900;background:#ffcc00;padding:10px;border-radius:8px;text-align:center}
.feed{padding:0 10px 30px 10px;display:flex;flex-direction:column;gap:18px}
.card{background:#fff;border:1px solid #eee;border-radius:12px;overflow:hidden}
.card img{width:100%;height:auto;display:block;object-fit:contain;background:#f5f5f5;min-height:100px}
.info{padding:10px;display:flex;gap:10px;align-items:center}
.logo{width:56px;height:56px;border-radius:50%;overflow:hidden;flex-shrink:0;border:2px solid #fff;background:#8a0c06;box-shadow:0 0 0 2px #d4af37,0 0 0 3px #fff;display:flex;align-items:center;justify-content:center}
.logo img{width:100%;height:100%;object-fit:cover;object-position:50% 8%;transform:scale(0.92);display:block}
.info b{font-size:15px;line-height:1.4;display:block;word-break:break-all}
.info span{font-size:14px;color:#555}
.actions{display:flex;gap:18px;padding:0 10px 12px 76px;color:#333;font-size:15px;font-weight:700}
#status{padding:12px;text-align:center;font-weight:700}
</style>
</head>
<body>
<div class="sec" id="totalSec">TOTAL 156 POSTER</div>
<div id="status">Posters load ho rahe hain...</div>
<div id="all"></div>
<script>
var USER="amarsinghparihar";
var REPO="surya-gita";
function makeCard(name, src){
  var card=document.createElement("div"); card.className="card";
  var img=document.createElement("img"); img.loading="lazy"; img.alt=name; img.src=src;
  img.onerror=function(){ card.style.display="none"; };
  var info=document.createElement("div"); info.className="info";
  info.innerHTML='<div class="logo"><img src="logo.png?v=7" alt=""></div><div><b>'+name+'</b><span class="posterCount">SURYA GITA</span></div>';
  var act=document.createElement("div"); act.className="actions"; act.textContent="👍 Like    💬 Comment    ↗️ Share";
  card.appendChild(img); card.appendChild(info); card.appendChild(act);
  return card;
}
function updateTotal(n){
  document.getElementById("totalSec").textContent="TOTAL "+n+" POSTER";
  document.getElementById("status").textContent="Total posters: "+n+" POSTER";
  document.querySelectorAll(".posterCount").forEach(function(s){ s.textContent="SURYA GITA - "+n+" POSTER"; });
}
function buildFromList(files){
  var all=document.getElementById("all");
  var feed=document.createElement("div"); feed.className="feed"; all.appendChild(feed);
  files.forEach(function(f){ feed.appendChild(makeCard(f.name, f.download_url)); });
  updateTotal(files.length);
}
function buildFromNames(){
  var all=document.getElementById("all");
  var feed=document.createElement("div"); feed.className="feed"; all.appendChild(feed);
  var base="https://raw.githubusercontent.com/"+USER+"/"+REPO+"/main/";
  for(var i=0;i<60;i++){ feed.appendChild(makeCard("amai-id-"+i+".jpg", base+"amai-id-"+i+".jpg")); }
  for(var j=0;j<120;j++){ var n=("00"+j).slice(-3); feed.appendChild(makeCard("amar-"+n+".jpg", base+"amar-"+n+".jpg")); }
  for(var k=1;k<=34;k++){ feed.appendChild(makeCard("amar-news-"+k+".jpg", base+"amar-news-"+k+".jpg")); }
  feed.appendChild(makeCard("organiser-news-1.jpg", base+"organiser-news-1.jpg"));
  feed.appendChild(makeCard("organiser-news-2.jpg", base+"organiser-news-2.jpg"));
  updateTotal(156);
}
fetch("https://api.github.com/repos/"+USER+"/"+REPO+"/contents/?per_page=1000").then(function(r){return r.json()}).then(function(list){
  if(!list || !list.length || list.message){ buildFromNames(); return; }
  var files=list.filter(function(f){return f.type==="file" && /\.(jpg|jpeg|png|webp|gif)$/i.test(f.name)}).sort(function(a,b){return a.name.localeCompare(b.name)});
  if(files.length<10){ buildFromNames(); } else { buildFromList(files); }
}).catch(function(){ buildFromNames(); });
</script>
</body>
</html>
