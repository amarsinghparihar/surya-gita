<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SURYA GITA</title></head>
<body style="margin:0;text-align:center;background:#fffbe6">
<div style="position:sticky;top:0;background:#fffbe6;padding:12px;border-bottom:1px solid #ccc">
<b style="font-size:22px">☀️ SURYA GITA 🚩</b><br>Total: <span id="cnt">0</span><br>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="padding:8px 20px;background:#ff6600;color:#fff;border:none;border-radius:10px">HOME</button>
</div><div id="g"></div>
<script>
let g=document.getElementById('g'),c=0;
function add(s){let i=new Image();i.style="max-width:95%;margin:10px auto;display:block;border-radius:10px";i.onload=function(){g.appendChild(this);c++;cnt.innerText=c};i.src=s}
add("amar-pic-8.jpg");add("amar-pic-9.jpg");add("amar-primary-tratak.jpg");
for(let k=1;k<=50;k++){add("amar-pic-"+k+".jpg");add("amar-img-"+k+".jpg")}
</script></body></html>
