<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SURYA GITA</title><style>body{margin:0;background:#000;color:gold;text-align:center}button{background:gold;color:#000;padding:15px 30px;font-size:20px;font-weight:bold;border-radius:10px;margin:20px;border:0}#gallery{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:10px}#gallery img{width:330px;max-width:95%;border:3px solid gold;border-radius:10px}</style></head><body><button>HOME PAGE - 99 PHOTOS</button><div id="gallery">Loading...</div><script>fetch('https://api.github.com/repos/amarsinghparihar/surya-gita/contents').then(r=>r.json()).then(files=>{let g=document.getElementById('gallery');g.innerHTML='';files.forEach(f=>{let n=f.name.toLowerCase();if(n.endsWith('.jpg')){let im=document.createElement('img');im.src=f.name;g.appendChild(im)}})})</script></body></html>
