<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SURYA GITA</title>
<style>
body{background:#f5f5f5;font-family:sans-serif;padding:15px;margin:0}
.block{max-width:650px;margin:20px auto;background:#fff8e1;border:2px solid #d32f2f;border-radius:14px;padding:25px 20px;text-align:center}
.block h1{color:#d32f2f;font-size:32px;margin:0}
.om{font-size:24px;font-weight:bold;margin:15px 0}
hr{border:none;border-top:2px solid #d32f2f;margin:20px 0}
p{font-size:18px;line-height:1.7}
</style>
</head>
<body>
<div class="block">
<h1>SURYA GITA</h1>
<div class="om">ॐ तत्सत्</div>
<hr>
<p>Yahan aapka block ka text aayega.</p>
</div>
</body>
</html>
